<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestiCom | Générateur de Licences</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --primary: #f97316;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100-vh;
            overflow: hidden;
            background: radial-gradient(circle at top right, #f9731615, transparent),
                        radial-gradient(circle at bottom left, #0f172a, #020617);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--primary);
        }

        h1 {
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            font-style: italic;
        }

        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .field-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 0.75rem;
            padding-left: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            width: 18px;
            height: 18px;
        }

        input {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.25rem 1.25rem 1.25rem 3.5rem;
            color: white;
            font-family: inherit;
            font-weight: 700;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.25rem;
            border-radius: 16px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 2rem;
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        .btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            display: none;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .key-display {
            background: #020617;
            padding: 1.5rem;
            border-radius: 16px;
            border: 2px solid #10b98120;
            text-align: center;
            font-family: monospace;
            font-size: 1.4rem;
            font-weight: 900;
            color: #10b981;
            letter-spacing: 2px;
            position: relative;
            cursor: pointer;
        }

        .copy-hint {
            font-size: 0.7rem;
            margin-top: 0.75rem;
            text-align: center;
            color: #64748b;
        }

        .success-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #10b98115;
            color: #10b981;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-box">
                <i data-lucide="shield-check"></i>
            </div>
            <h1>GestiCom KeyGen</h1>
            <p class="subtitle">Générateur de Clés Officiel - Administrateur uniquement</p>
        </div>

        <div class="card">
            <div class="field-group">
                <label>Identifiant Machine (HWID)</label>
                <div class="input-wrapper">
                    <i data-lucide="smartphone"></i>
                    <input type="text" id="hwidInput" placeholder="ex: GCOM-1A2B-3C4D" oninput="this.value = this.value.toUpperCase()">
                </div>
            </div>

            <button class="btn" onclick="generate()">
                Générer la Clé
                <i data-lucide="key"></i>
            </button>

            <div id="result" class="result-box">
                <div class="success-badge">
                    <i data-lucide="check-circle" style="width: 14px;"></i>
                    Clé générée avec succès
                </div>
                <div class="key-display" id="keyOutput" onclick="copyKey()">
                    XXXX-XXXX-XXXX-XXXX
                </div>
                <p class="copy-hint">Cliquez sur la clé pour la copier</p>
            </div>
        </div>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #475569; font-weight: 800; letter-spacing: 2px;">
            DÉVELOPPÉ PAR GSN EXPERTISES GROUP
        </p>
    </div>

    <script>
        lucide.createIcons();

        const SALT = "GESTICOM-SECRET-SAFETY-2026";

        // Fonction de hachage SHA-256 native au navigateur
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function generate() {
            const hwid = document.getElementById('hwidInput').value.trim();
            if (!hwid.startsWith('GCOM-')) {
                alert("L'ID doit commencer par 'GCOM-'");
                return;
            }

            const rawHash = await sha256(hwid + SALT);
            const hash = rawHash.toUpperCase();
            const key = `${hash.substring(0, 4)}-${hash.substring(8, 12)}-${hash.substring(16, 20)}-${hash.substring(24, 28)}`;

            document.getElementById('keyOutput').innerText = key;
            document.getElementById('result').style.display = 'block';
        }

        function copyKey() {
            const key = document.getElementById('keyOutput').innerText;
            navigator.clipboard.writeText(key).then(() => {
                alert("Clé copiée dans le presse-papier !");
            });
        }
    </script>
</body>
</html>
